<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HerdNerd Pro — Pedigree Diagnostic</title>
<script src="pdf-lib.min.js"></script>
<script src="fontkit.umd.min.js"></script>
<style>
  body{ font-family:-apple-system,sans-serif; max-width:640px; margin:0 auto; padding:20px; background:#f7f2e6; color:#142440; }
  h1{ font-size:20px; }
  .row{ display:flex; align-items:flex-start; gap:10px; padding:10px 12px; margin-bottom:6px; border-radius:8px; background:#fffdf8; border:1px solid #e0dccf; }
  .row.ok{ border-color:#3d6b4a; }
  .row.fail{ border-color:#a34632; background:#fbeceb; }
  .icon{ font-size:18px; flex:0 0 auto; }
  .label{ font-weight:600; }
  .detail{ font-size:13px; color:#555; margin-top:2px; word-break:break-word; }
  #summary{ margin-top:20px; padding:14px; border-radius:8px; font-weight:600; font-size:16px; }
  #summary.ok{ background:#dcead9; color:#1e2e22; }
  #summary.fail{ background:#f3ded9; color:#a34632; }
  a.btn{ display:inline-block; margin-top:14px; padding:10px 16px; background:#142440; color:white; border-radius:8px; text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<h1>Pedigree PDF Diagnostic</h1>
<p style="font-size:13px; color:#555;">This checks every piece the pedigree preview depends on and shows the real result right here — no console needed. Just wait for it to finish, then read down the list.</p>
<div id="results"></div>
<div id="summary"></div>

<script>
const FONT_FILES = [
  'CormorantGaramond-SemiBold.ttf','CormorantGaramond-MediumItalic.ttf','PublicSans-Regular.ttf',
  'PublicSans-SemiBold.ttf','JetBrainsMono-Medium.ttf','JetBrainsMono-Bold.ttf','PlayfairDisplay-Bold.ttf',
  'Cinzel-Bold.ttf','GreatVibes-Regular.ttf','LibreBaskerville-Bold.ttf','DMSerifDisplay-Regular.ttf',
  'Montserrat-Bold.ttf','Jost-SemiBold.ttf','Allura-Regular.ttf','AlexBrush-Regular.ttf',
  'UnifrakturMaguntia-Regular.ttf','Caveat-Bold.ttf'
];

const resultsEl = document.getElementById('results');
let anyFail = false;

function addRow(label, ok, detail){
  if(!ok) anyFail = true;
  const div = document.createElement('div');
  div.className = 'row ' + (ok?'ok':'fail');
  div.innerHTML = `<div class="icon">${ok?'✅':'❌'}</div><div><div class="label">${label}</div>${detail?`<div class="detail">${detail}</div>`:''}</div>`;
  resultsEl.appendChild(div);
}

(async () => {
  // 1. Did pdf-lib.min.js actually load?
  if(typeof PDFLib === 'undefined'){
    addRow('pdf-lib.min.js loaded', false, 'window.PDFLib is undefined. This file is either missing from your repo root, or it got overwritten with the wrong content (this happened once before with the fontkit file). Re-upload the real pdf-lib.min.js.');
  } else {
    addRow('pdf-lib.min.js loaded', true, 'window.PDFLib is present.');
  }

  // 2. Did fontkit.umd.min.js actually load?
  if(typeof fontkit === 'undefined'){
    addRow('fontkit.umd.min.js loaded', false, 'window.fontkit is undefined. Check this file exists at your repo root and wasn\'t accidentally overwritten.');
  } else {
    addRow('fontkit.umd.min.js loaded', true, 'window.fontkit is present.');
  }

  // 3. Can we fetch every font file?
  let allFontsOk = true;
  const missingFonts = [];
  for(const name of FONT_FILES){
    try{
      const res = await fetch('fonts/' + name);
      if(!res.ok){ allFontsOk = false; missingFonts.push(name + ' (status ' + res.status + ')'); }
    }catch(e){
      allFontsOk = false; missingFonts.push(name + ' (network error: ' + e.message + ')');
    }
  }
  addRow('All 17 font files found in fonts/ folder', allFontsOk,
    allFontsOk ? 'Every font fetched successfully.' : 'Missing or failing: ' + missingFonts.join(', '));

  // 4. Full end-to-end test: actually build a tiny real PDF, same way the app does
  if(typeof PDFLib !== 'undefined' && typeof fontkit !== 'undefined' && allFontsOk){
    try{
      const { PDFDocument, rgb } = PDFLib;
      const doc = await PDFDocument.create();
      doc.registerFontkit(fontkit);
      const page = doc.addPage([300,150]);
      const fontBytes = await fetch('fonts/CormorantGaramond-SemiBold.ttf').then(r=>r.arrayBuffer());
      const font = await doc.embedFont(fontBytes);
      page.drawText('Diagnostic OK', { x:30, y:70, size:24, font, color: rgb(0.08,0.14,0.25) });
      const bytes = await doc.save();
      const blob = new Blob([bytes], {type:'application/pdf'});
      const url = URL.createObjectURL(blob);
      addRow('Full test PDF generated', true, bytes.length + ' bytes. This is the real pipeline working end to end.');
      const link = document.createElement('a');
      link.href = url; link.className = 'btn'; link.textContent = 'Open the test PDF';
      link.target = '_blank';
      document.getElementById('summary').after(link);
    }catch(e){
      addRow('Full test PDF generated', false, 'Error: ' + e.message);
    }
  } else {
    addRow('Full test PDF generated', false, 'Skipped — one of the pieces above already failed, so this couldn\'t run.');
  }

  const summary = document.getElementById('summary');
  if(anyFail){
    summary.className = 'fail';
    summary.textContent = '❌ Something above is broken — that\'s exactly what\'s causing "can\'t generate preview." Fix the red item(s) first, then reload this page to confirm before trying the real app again.';
  } else {
    summary.className = 'ok';
    summary.textContent = '✅ Everything the pedigree preview needs is working correctly. If the real app still fails, the problem is somewhere else — send this "all green" result back and we\'ll look further.';
  }
})();
</script>
</body>
</html>
